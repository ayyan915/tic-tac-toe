<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0B231E">
    <title>Tic Tac Toe</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" href="/static/icons/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --felt-deep: #0B231E;
            --felt: #123A31;
            --rule: #2C6354;
            --ivory: #F0E9DA;
            --amber: #E9A83C;
            --muted: #8FB3A8;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            background: var(--felt-deep);
            color: var(--ivory);
            font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            padding-bottom: max(24px, env(safe-area-inset-bottom));
        }

        .menu {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
        }

        .mark-board {
            width: min(46vw, 156px);
            height: auto;
        }

        .mark-board .grid-line {
            stroke: var(--rule);
            stroke-width: 6;
            stroke-linecap: round;
        }

        .mark-board .x {
            stroke: var(--ivory);
            stroke-width: 9;
            stroke-linecap: round;
            fill: none;
        }

        .mark-board .o {
            stroke: var(--amber);
            stroke-width: 9;
            fill: none;
        }

        .mark-board .win {
            stroke: var(--amber);
            stroke-width: 5;
            stroke-linecap: round;
            opacity: .65;
        }

        h1 {
            font-family: "Fraunces", Georgia, serif;
            font-weight: 600;
            font-size: clamp(30px, 9vw, 40px);
            line-height: 1.1;
            margin: 0;
            text-align: center;
            letter-spacing: -0.01em;
        }

        .sub {
            margin: 8px 0 0;
            text-align: center;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.5;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .btn {
            display: block;
            width: 100%;
            min-height: 56px;
            padding: 14px 20px;
            border-radius: 12px;
            border: 1px solid var(--rule);
            background: var(--felt);
            color: var(--ivory);
            font: inherit;
            font-weight: 500;
            font-size: 17px;
            text-align: left;
            text-decoration: none;
            cursor: pointer;
            transition: background .15s ease, border-color .15s ease;
        }

        .btn .hint {
            display: block;
            font-size: 13px;
            font-weight: 400;
            color: var(--muted);
            margin-top: 2px;
        }

        .btn:hover {
            background: #17463B;
            border-color: var(--amber);
        }

        .btn-primary {
            background: var(--amber);
            border-color: var(--amber);
            color: #14241A;
        }

        .btn-primary .hint {
            color: #3D3016;
        }

        .btn-primary:hover {
            background: #F2B850;
            border-color: #F2B850;
        }

        .btn:focus-visible {
            outline: 3px solid var(--amber);
            outline-offset: 3px;
        }

        .btn-primary:focus-visible {
            outline-color: var(--ivory);
        }

        @media (hover: none) {
            .btn:hover {
                background: var(--felt);
                border-color: var(--rule);
            }

            .btn-primary:hover {
                background: var(--amber);
                border-color: var(--amber);
            }
        }
    </style>
</head>

<body>
    <main class="menu">
        <svg class="mark-board" viewBox="0 0 180 180" role="img" aria-label="A finished tic tac toe board">
            <line class="grid-line" x1="60" y1="12" x2="60" y2="168" />
            <line class="grid-line" x1="120" y1="12" x2="120" y2="168" />
            <line class="grid-line" x1="12" y1="60" x2="168" y2="60" />
            <line class="grid-line" x1="12" y1="120" x2="168" y2="120" />

            <path class="x" d="M18 18 L42 42 M42 18 L18 42" />
            <circle class="o" cx="90" cy="30" r="14" />
            <circle class="o" cx="150" cy="30" r="14" />

            <path class="x" d="M78 78 L102 102 M102 78 L78 102" />
            <circle class="o" cx="30" cy="90" r="14" />

            <path class="x" d="M138 138 L162 162 M162 138 L138 162" />
            <circle class="o" cx="30" cy="150" r="14" />

            <line class="win" x1="30" y1="30" x2="150" y2="150" />
        </svg>

        <div>
            <h1>Tic Tac Toe</h1>
            <p class="sub">Play a friend in real time, or take on the computer.</p>
        </div>

        <div class="actions">
            <a class="btn btn-primary" href="/play">
                Play a friend
                <span class="hint">You'll be matched with the next player waiting</span>
            </a>
            <a class="btn" href="/bot/play">
                Play the computer
                <span class="hint">Start right away, no waiting</span>
            </a>
        </div>
    </main>
</body>

</html>
